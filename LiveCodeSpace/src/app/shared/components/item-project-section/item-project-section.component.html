
<div class="mx-auto grid grid-cols-1 items-center gap-x-8 gap-y-16 px-4 py-24 sm:px-6 sm:py-16 xl:grid-cols-2 lg:px-8">
    <div>
      <div class="text-start">
        <h1
          class="text-balance text-4xl font-semibold tracking-tight text-gray-900 dark:text-white mb-2"
        >
          {{ item.name }}
        </h1>
        @if (item.type == 'pago') {
          <p class="text-pretty text-lg font-medium text-gray-500 sm:text-xl/8 dark:text-gray-300">
            Cliente: {{item.client?.name}}
          </p>
        }

        @if(item.url !== 'private' && item.url !== undefined){
          <p class="text-pretty text-lg font-medium text-gray-500 sm:text-xl/8 dark:text-gray-300">
            Link: <a [href]="item.url" target="_blank" class="text-indigo-500 hover:text-indigo-400">{{item.url}}</a>
          </p>
          <div
          class="inline-flex items-center rounded-full px-4 py-1 font-medium text-white whitespace-nowrap transition ease-in-out hover:-translate-y-1 hover:scale-110 hover:cursor-default bg-green-400 mr-5 mt-2"
        >
          <i
            class="fa-solid fa-globe mr-2 scale-105"
          ></i>
            Online 
        </div>
          <div
          class="inline-flex items-center rounded-full px-4 py-1 font-medium text-white whitespace-nowrap transition ease-in-out hover:-translate-y-1 hover:scale-110 hover:cursor-default bg-blue-400 mr-5 mt-2"
        >
          <i
            class="fa-solid fa-unlock mr-2 scale-105"
          ></i>
            Public 
        </div>
        } 
        @else{
          <div
            class="inline-flex items-center rounded-full px-4 py-1 font-medium text-white whitespace-nowrap transition ease-in-out hover:-translate-y-1 hover:scale-110 hover:cursor-default bg-red-600 mr-5 mt-2"
          >
            <i
              class="fa-solid fa-lock mr-2 scale-105"
            ></i>
              Private
          </div>
        }

        @if(item.status == 'dev'){
        <div
          class="inline-flex items-center rounded-full px-4 py-1 font-medium text-white whitespace-nowrap transition ease-in-out hover:-translate-y-1 hover:scale-110 hover:cursor-default bg-indigo-400 mr-5 mt-2"
        >
          <i
            class="fa-solid fa-code mr-2 scale-105"
          ></i>
            In development 
        </div>
        }

        <div
          class="max-h-[200px] overflow-y-auto scrollbar-thin scrollbar-thumb-indigo-600 scrollbar-track-transparent p-4 rounded-md mt-5"
        >
          <p
            class="text-pretty text-lg font-medium text-gray-500 sm:text-xl/8 dark:text-gray-300"
          >
            {{ item.text }}
          </p>
        </div>
        <app-tags [items]="item.tags"></app-tags>
        <h1 class="text-white">{{index}}</h1>
      </div>
    </div>
    <div class="w-full h-full">
      <div class="flex flex-col items-center gap-2">
        <img
          src="./assets/img/projects/{{ item.img[currentImageIndex] }}"
          class="h-[500px] transition-opacity duration-1000 ease-in-out"
          [class.opacity-0]="fadeIn"
        />
        <img src="./assets/img/circles.svg" />
      </div>
    </div>
</div>
