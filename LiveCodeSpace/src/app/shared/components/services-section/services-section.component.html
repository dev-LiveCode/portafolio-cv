<section>
  <div class="w-full h-full transition-opacity duration-500" [class.opacity-0]="isContentHidden">

    
    <div class="relative">
      <div class="sticky -top-10 h-screen flex flex-col items-center justify-center ">
        <h1 class="text-center text-[300px] font-medium tracking-tight text-gray-900 dark:text-white mb-10">Services</h1>
      </div>
      @for (item of services; track $index) {
      <div class="sticky top-0 h-screen flex flex-col items-center justify-center ">
        <div class="w-[50%] bg-white dark:bg-gray-800 rounded-lg shadow-2xl dark:shadow-lg p-6 transition-all duration-300 hover:scale-105 hover:bg-gray-300 dark:hover:bg-gray-600">
          <h3 class="text-2xl font-semibold dark:text-indigo-500 text-indigo-600 mb-4 text-center">{{item.title}}</h3>
          <p class="text-lg text-gray-600 dark:text-gray-400">
            {{item.text}}
          </p>
        </div>
      </div>
      }
    </div>
