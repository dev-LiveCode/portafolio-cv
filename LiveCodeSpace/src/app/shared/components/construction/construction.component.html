<section>
  <div class="relative isolate">
    <!-- burbujas -->
    <div
      class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80"
      aria-hidden="true"
    >
      <div
        class="relative left-[calc(50%-11rem)] aspect-[1155/678] w-[36.125rem] -translate-x-1/2 rotate-[30deg] bg-gradient-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%-30rem)] sm:w-[72.1875rem]"
        style="
          clip-path: polygon(
            74.1% 44.1%,
            100% 61.6%,
            97.5% 26.9%,
            85.5% 0.1%,
            80.7% 2%,
            72.5% 32.5%,
            60.2% 62.4%,
            52.4% 68.1%,
            47.5% 58.3%,
            45.2% 34.5%,
            27.5% 76.7%,
            0.1% 64.9%,
            17.9% 100%,
            27.6% 76.8%,
            76.1% 97.7%,
            74.1% 44.1%
          );
        "
      ></div>
    </div>

    <!-- content -->
    <div class="container pt-52">
        <div class="flex items-center justify-center">
          <div class="relative h-full overflow-hidden animate-shape-change">
            <h1
              class="text-balance text-5xl pb-14 font-semibold tracking-tight text-gray-900 dark:text-white sm:text-7xl"
            >
              In development
            </h1>
            <img
              src="./assets/img/construction-page.svg"
              alt="Picture construction page"
              class="h-[50%]"
            />
          </div>
        </div>
      </div>


    <!-- Burbujas -->
    <div
      class="absolute inset-x-0 top-[calc(100%-13rem)] -z-10 transform-gpu overflow-hidden blur-3xl sm:top-[calc(100%-30rem)]"
      aria-hidden="true"
    >
      <div
        class="relative left-[calc(50%+3rem)] aspect-[1155/678] w-[36.125rem] -translate-x-1/2 bg-gradient-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%+36rem)] sm:w-[72.1875rem]"
        style="
          clip-path: polygon(
            74.1% 44.1%,
            100% 61.6%,
            97.5% 26.9%,
            85.5% 0.1%,
            80.7% 2%,
            72.5% 32.5%,
            60.2% 62.4%,
            52.4% 68.1%,
            47.5% 58.3%,
            45.2% 34.5%,
            27.5% 76.7%,
            0.1% 64.9%,
            17.9% 100%,
            27.6% 76.8%,
            76.1% 97.7%,
            74.1% 44.1%
          );
        "
      ></div>
    </div>

    <!-- Galaxias -->
    <div
      class="absolute -z-10 sm:top-[calc(100%-30rem)] md:rotate-[-5deg] top-[240px] md:-top-[250px] left-0 w-full px-[40px]"
      aria-hidden="true"
    >
      <img
        src="./assets/img/starsBG.svg"
        width="1500"
        height="1500"
        decoding="async"
        loading="eager"
      />
    </div>

    <div class="absolute -z-10 bottom-0 left-0 w-full" aria-hidden="true">
      <img
        src="./assets/img/starsBG.svg"
        width="1500"
        height="1500"
        decoding="async"
        loading="eager"
      />
    </div>

    <div class="absolute -z-10 top-0 right-0 w-full" aria-hidden="true">
      <img
        src="./assets/img/starsBG.svg"
        width="1500"
        height="1500"
        decoding="async"
        loading="eager"
      />
    </div>
  </div>


  
</section>
