<section class="h-[1400px]  xl:h-[700px]">
  <div class="relative isolate px-6 pt-16 lg:px-8 bg-transparent w-full h-full transition-opacity duration-500" [class.opacity-0]="isContentHidden">
    <h1 class="text-center text-balance text-5xl font-medium tracking-tight text-gray-900 dark:text-white">Projects</h1>

      <!-- <div
        *ngFor="let item of projects; index as i"
        >
        <app-item-project-section [item]="item" [class.opacity-0]="active !== i"></app-item-project-section>
      </div> -->

    <div class="transition-opacity duration-500" [class.opacity-0]="opacity">
      <app-item-project-section [item]="itemActive" ></app-item-project-section>
    </div>


    <button type="button" class="absolute start-0 top-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" (click)="prev()">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full dark:bg-white/30 bg-gray-800/30 dark:group-hover:bg-white/50 group-hover:bg-gray-800/60 group-focus:ring-4 dark:group-focus:ring-white group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 dark:text-white text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
            </svg>
            <span class="sr-only">Previous</span>
        </span>
    </button>
    <button type="button" class="absolute end-0 top-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" (click)="next()">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full dark:bg-white/30 bg-gray-800/30 dark:group-hover:bg-white/50 group-hover:bg-gray-800/60 group-focus:ring-4 dark:group-focus:ring-white group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 dark:text-white text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
            </svg>
            <span class="sr-only">Next</span>
        </span>
    </button>
  </div>

</section>
